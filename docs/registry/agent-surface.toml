# Agent-facing surface manifest — the machine-readable "how to drive this repo".
#
# Prose companion: docs/references/agent-integration.md (the five integration
# channels, the text-over-pixels rule, the error-as-directive convention).
# Mechanically gated by tools/check_repo_contracts.py (agent_surface_issues):
# every string value under a key ending in _path/_dir/_doc (plus the DAP `scene`)
# must resolve to an existing repo path — res:// maps to the repo root; user://
# and .godot-smoke/ values are runtime/gitignored locations and are skipped by
# design — and every `port` must be a valid integer port.
#
# Agent-vendor-neutral by house rule: protocols and repo artifacts only. No
# vendored MCP server, no committed agent-client configs (those are per-developer
# and gitignored — see agent-integration.md § Attaching an agent or MCP server).
schema_version = 1

[protocols.dap]
# Godot Debug Adapter Protocol endpoint (the Godot editor must be listening).
# 6006 is the default; verify_all accepts --dap-host/--dap-port so parallel
# checkouts can target their own editor instead of attaching to a foreign one.
# The repo's reference client / smoke driver writes .godot-smoke/scenario.json,
# which the app consumes at boot; the canonical scenario set is the driver's
# SCENARIO_REQUIREMENTS table.
host = "127.0.0.1"
port = 6006
driver_path = "tools/godot_dap_smoketest.py"
scene = "res://scenes/app/Main.tscn"
command = "python3 tools/godot_dap_smoketest.py --project <abs-repo-path> --scene res://scenes/app/Main.tscn --scenario <name>"
scenario_source_path = "tools/godot_dap_smoketest.py"
reference_doc = "docs/references/godot-dap.md"

[protocols.lsp]
# GDScript language server: LSP over TCP ONLY (no stdio), and ONLY while the
# Godot editor is running with this project open. An agent host that needs stdio
# must run a per-developer stdio<->TCP bridge (never vendored in this repo).
host = "127.0.0.1"
port = 6005
transport = "tcp"
requires_editor_open = true

[scenario_cli]
# The automated playtest suite. PLAYTEST_SCENARIOS (in the tool) is the canonical
# scenario list; --include-smoke appends SMOKE_SCENARIOS; PLAYTEST_FORCE_HEADLESS=1
# forces the headless transport, under which windowed-only scenarios report
# SKIP-with-reason, never FAIL (transport honesty).
tool_path = "tools/run_playtests.py"
scenario_list_source_path = "tools/run_playtests.py"
smoke_list_flag = "--include-smoke"
headless_env = "PLAYTEST_FORCE_HEADLESS=1"
report_path = ".godot-smoke/playtest-report.json"

[play_agent]
# OPTIONAL reference driver only: a scripted windowed play agent driving the
# app through the same scenario/transport seams as the suite. ANY scripted
# play agent can fulfill this role — the repo artifacts the contract, never
# the client (agent-vendor-neutral house rule). Windowed-only by design.
driver_path = "tools/commandcode_play_agent.py"
scenario = "play_agent"
windowed_only = true
optional = true

[traces]
# One JSON object per line, record shape {event, ts_msec, source, payload}.
# Appended by the emitter below and mirrored on stdout (both harness transports
# parse it there). Event schema and per-event meanings live in the schema doc.
log_path = "user://logs/agent_trace.jsonl"
record_shape = "{event, ts_msec, source, payload}"
emitter_path = "scripts/core/trace_logger.gd"
schema_doc = "docs/references/trace-events.md"

[ui_tree]
# Structured UI-tree dumps (the text-first accessibility surface): the
# scenario drives the agent-facing screens while the writer (producer_path)
# owns the bytes — one JSON per screen under dump_dir at runtime (gitignored,
# so the path gate skips it by design). Node shape and the widget a11y
# annotation contract live in contract_doc.
dump_dir = ".godot-smoke/ui_tree"
scenario = "ui_tree_dump"
producer_path = "scripts/app/ui_tree_dump_writer.gd"
contract_doc = "docs/references/accessibility.md"

[monitors]
# Live-probe Performance monitors (names are exact): queryable via
# Performance.get_custom_monitor even in RELEASE builds — the JSONL trace is
# the file artifact, these are the in-process surface.
producer_path = "scripts/runtime/performance_monitors.gd"
names = ["game/party_size", "game/world_seed", "game/current_screen"]
query_api = "Performance.get_custom_monitor"

[feedback_reports]
# Public issues carry only a sanitized handoff and report id. Raw release-build
# reproduction artifacts remain private and require the maintainer credential.
schema_doc = "docs/references/feedback-report-schema.md"
fetch_tool_path = "tools/fetch_feedback_report.py"
validator_tool_path = "tools/inspect_feedback_bundle.py"
product_spec_doc = "docs/product-specs/playtest-feedback.md"
issue_repository = "ThomsenDrake/poke-wilds-gd"
bundle_entrypoint = "report.json"
fetch_command = "python3 tools/fetch_feedback_report.py <report-id>"
deployment_workflow_path = ".github/workflows/feedback-relay-deploy.yml"
release_workflow_path = ".github/workflows/playtest-release.yml"
staging_environment = "feedback-staging"
production_environment = "feedback-production"
deployment_trigger = "push to main changing services/feedback-relay/**"

[visual_baselines]
# Committed golden screenshots plus metadata sidecars (<shot>.png.sidecar.json).
# visual_sweep_update (and the satellite *_update scenarios) regenerate them;
# compare-mode sweeps diff against them. Windowed lanes that cannot run report
# SKIP, never PASS — a skipped lane certifies nothing.
baseline_dir = "docs/generated/visual-baselines"
sidecar_suffix = ".png.sidecar.json"
update_scenario = "visual_sweep_update"

[vision_review]
# Lane-4 model review of windowed sweep shots: the reviewer answers the rubric
# judgment questions and writes report_path (gitignored run output, skipped by
# the path gate by design). QUARANTINE-FOREVER semantics: model findings are
# advisory quarantine-tier and must NEVER be promoted to red/blocking.
# override_env swaps the reviewer command; required_env=1 fails closed on a
# missing or incomplete model review.
report_path = ".godot-smoke/vision-review.json"
reviewer_path = "tools/vlm_reviewer.py"
reviewer_command = "python3 tools/vlm_reviewer.py"
override_env = "VISION_REVIEWER_CMD"
required_env = "VLM_REQUIRED"

[determinism]
# Scenario-authoring convention: call seed_for_smoke BEFORE any pass-gating draw;
# it pins the shared, battle, and player rngs and resets Pokemon creation order.
# verify_all lanes: S5 project-settings pins, S6 pixel canary, S6.5 double-run
# (the rng-consumer scenarios run twice headless, canonical trace cmp).
seed_convention = "seed_for_smoke"
seed_owner_path = "scripts/runtime/game_runtime.gd"
verify_tool_path = "tools/verify_all.py"

[golden_save]
save_path = "docs/generated/golden-saves/v4_golden.json"

[preflight]
# Bootstrap a fresh existing worktree before the local gate. The setup command
# prepares only ignored caches/import output and refuses tracked-byte drift.
worktree_setup_tool_path = "tools/setup_worktree.py"
worktree_setup_command = "python3 tools/setup_worktree.py"
worktree_quick_setup_command = "python3 tools/setup_worktree.py --quick"
codex_cloud_setup_tool_path = "tools/setup_codex_cloud.sh"
codex_cloud_setup_command = "bash tools/setup_codex_cloud.sh"
codex_cloud_visual_tool_path = "tools/run_codex_cloud_visuals.sh"
codex_cloud_visual_check_command = "bash tools/run_codex_cloud_visuals.sh --check"
codex_cloud_visual_focused_command = "bash tools/run_codex_cloud_visuals.sh --focused"
codex_cloud_visual_full_command = "bash tools/run_codex_cloud_visuals.sh"
# The local pre-push gate. Display-less agents run the --skip-windowed form
# (windowed lanes reported SKIP, never PASS); the full gate needs a display.
gate_tool_path = "tools/verify_all.py"
display_less_command = "python3 tools/verify_all.py --skip-windowed"
full_command = "python3 tools/verify_all.py"
cloud_display_tool_path = "tools/ensure_cloud_display.sh"
cloud_env_tool_path = "tools/cloud_env.py"
cloud_install_tool_path = ".cursor/install.sh"
cloud_start_tool_path = ".cursor/start.sh"

[errors]
# Every agent-facing failure is an error-as-directive: a stable code, a
# `retryable` flag, and an imperative `hint` naming the next action. Defined in:
convention_doc = "docs/references/agent-integration.md"
