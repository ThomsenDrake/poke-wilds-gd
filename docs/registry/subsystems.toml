# COMPREHENSIVE WORLD-GEN AUDIT (the world-generation workflow; audit-first, fixes land in
# later slices). Measures THREE goals across a fixed seed list, NO rng (pure function of
# code + catalog + seeds — deterministic by construction, deliberately NOT a double-run
# consumer): (1) COHESION/BLENDING (world_gen_cohesion.gd — disc determinism density,
# ring admission, biome-adjacency histogram + hostile-pair count, the diamond ring-seam
# metric, region-size/speck distribution, per-ring biome histogram + SNOW/LAVA extreme
# reach); (2) SPAWN↔STATS (world_gen_spawns.gd — the first BST computation anywhere in the
# codebase, type↔biome coherence + the legendary/egg no-leak invariant, fallback-disjoint
# leaks, BST↔depth + level-band↔strength analysis); (3) DUNGEON SITES (world_gen_dungeons.gd
# — per-biome footprint site availability incl. LAVA, anchors-in-extent, spawn-disc
# exclusion, spawn reachability, the unimplemented spec §19(c) gen-time reachability gate as
# an advisory). TIER RULE: world_gen_audit_passed gates on the ENFORCING tier only (structural
# invariants that hold today); every gap needing a future fix rides the warning-tier
# world_gen_audit_advisory event (NEVER gates) — the advisory_findings ARE the fix-slice
# punch-list. Headline advisory findings today: LAVA never generates on origin (zero
# LAVA-dungeon sites; the later fix makes LAVA generate in deep rings and re-pins
# legendary_spawn_checks.gd EXPECTED_LAVA_ABSENT in lockstep), no biome blending/transition
# logic (hard-edged biomes + diamond seams at rings 10/28/60), and stats play no role in
# spawn assignment. The runner builds a FRESH WorldGenerator per seed (never the live
# _world_gen / shared _rng); the app reaches domain statics through the runner's re-exposed
# consts (app may not preload domain). Findings: res://.godot-smoke/world-gen-audit-findings.json
# (per-run) + the curated docs/generated/world-gen-audit-findings.md (committed).
# NOTE (infinite-world slices 2-3): the headline LAVA finding above is RESOLVED — the climate
# field (scripts/domain/biome_field.gd, world_runtime) generates LAVA as the rare hot+dry+
# volcanic joint tail (~0.02-0.9% of tiles per seed, present in 8 of the audit's 9 windows),
# so lava_site_gap flipped from expected-zero to rare-but-nonzero, and the ring admission /
# ring-seam / extent checks RETIRED with the radial model. The enforcing tier is NOW disc
# determinism + the biome-distribution contract (ten common biomes per 400-radius stride-4
# seed window + LAVA in >= LAVA_WINDOWS_MIN of 9 windows cross-seed) + pool no-leak + spawn
# reachability; blending + stat-aware spawns remain the open advisories. Slice 3 added the
# beyond-core content_density advisory + instance-keyed landmark reachability; origin-core
# preservation is the audit's pinning discipline. See docs/product-specs/infinite-world.md
# § Smoke validation.

