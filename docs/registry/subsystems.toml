# STONE ACQUISITION (Phase 5; spec: breeding-shinies-drops-fishing.md § Evolution
# stones; tech-debt item 11 RESOLVED): the resolver gained a DIG BONUS POOL parallel
# to the byte-untouched DIG_BIOME_ITEMS base yield (harvest_resolver.DIG_BONUS_POOLS +
# bonus_for + _dig_draw, a pure step-counter SplitMix over total_steps+tile — NO shared
# _rng consumed, the night_system determinism guarantee holds; harvest_runtime.harvest_tile's
# dig branch emits dig_item_found {tile [x,y], item_id, biome} alongside the unchanged
# field_move_used). FAITHFUL ONLY for biome SAND = the beach (fresh-beach.md "## Dig Items"
# pool {big_pearl, water_stone, clear_glass, revive}, exact wiki order — NOT a divergence).
# DIVERGENCE (flagged per-key in code + spec; the scrapes cite NO non-Beach stone source):
# GRASSLAND [leaf_stone], FOREST [leaf_stone, moon_stone], SAVANNA [fire_stone, thunderstone],
# DESERT [sun_stone], SWAMP [dusk_stone]; the rate DIG_BONUS_RARITY := 8 is invented even
# for the faithful Beach pool (wiki documents membership, no rate). PLAINS is deliberately
# ABSENT (dry_soil-only — keeps harvest_flow's PLAINS digs byte-identical, the regression
# guard). ice_stone / dawn_stone are UNASSIGNED by design (SNOW is not a diggable biome;
# both stay scenario-grant-only — the item-11 residual). stone_pool_contract_clean()
# preloads stone_evolution_runtime.gd for the STONE_ITEM_IDS CONST ONLY (single-source
# mandate; fails on hard_stone / a misspelled thunder_stone / any stone outside the set).
# dig_item_found is PINNED on the field_moves subsystem (witnessed by field_moves_flow's
# field_moves_dig_checks.gd dig group — Beach pool faithful / divergent pool pinned to the
# SHIPPED table / PLAINS negative control), NOT here: harvest_flow digs PLAINS only, so it
# never emits dig_item_found.

