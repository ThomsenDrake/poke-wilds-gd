# scenarios are miss-002-compliant: symmetric <name>_passed / <name>_failed{reasons}
# markers). rng_joint_pin + save_stability live HERE (the SmokeScenarios home; the
# save_migration_passed precedent) — rng_joint_pin pins ONE seed_for_smoke seed over a
# FIXED interleaving of encounter draws + fishing casts (fishing shares game_runtime._rng)
# + harvest dig steps (step-pure, NO shared _rng) and asserts the exact species/item
# sequence byte-stable across two in-scenario runs; save_stability drives scripted
# v4-surface mutations (deposit/withdraw, craft, repel_steps, pastures, stone/rod bag) →
# save → reload → save → byte-compare of the CANONICALIZED save JSON (key-sorted,
# ts/version-stripped) and commits ONE golden v4 fixture at docs/generated/golden-saves/
# v4_golden.json (load(golden) + canonical-form stability asserted). Their scenario files
# (rng_joint_pin_scenario.gd, save_stability_scenario.gd — single file, no checks split)
# join code_paths above. CO-MODIFICATION (tools; files stay owned by their homes):
#   tools/run_playtests.py — the region-gate post-step gains a RED sidecar
#     crafted_state.world_seed / shot_seq EQUALITY gate (a seed/sequence drift is refused,
#     never diffed; --update mode validates the SOURCE sidecar BEFORE the baseline
#     rewrite) plus a per-soak WARNING-COUNT TRIPWIRE (each soak ≤ the committed pin file
#     under docs/generated/ the builder creates; exceedance RED with the warning list);
#     visual_sweep_fishing(+_update) joins PLAYTEST_SCENARIOS / WINDOWED_SUBPROCESS_SCENARIOS /
#     WINDOWED_ONLY_SCENARIOS in tools/godot_dap_smoketest.py.
#   tools/verify_all.py — S9 gains the four satellite sweep families (shots 15-23
#     windowed-diffed one command) + the fishing satellite (Phase 7: SIX satellites —
#     world_depth [31,34] + the derived-world world_chain [35,36] join; the tuple is
#     single-sourced from run_playtests via importlib, R3 — see the landmarks entry),
#     and a DOUBLE-RUN determinism
#     lane lands AFTER S6: the six rng-consumer scenarios (playtest_journey, playtest_soak,
#     overworld_mons, shiny_odds, fishing_flow, breed_flow) twice headless, ts-stripped
#     canonical trace JSONL + payloads compared via a new determinism_verify.py cmp verb
#     (extending the previously unwired cmd_cmp); ≤90s budget; miss-002 mismatch payload.
#   tools/check_repo_contracts.py — gains the static rule banning RandomNumberGenerator in
#     *_sim.gd setup signatures (codifying overworld_mons_sim.gd:11) and a shot-numbering
