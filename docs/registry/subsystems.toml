# CROSS-SUBSYSTEM CO-MODIFICATION: storage EXTENDS the Phase-1 placement system with
# per-placement box CONTENTS (save schema v4, purely additive) plus the party-management
# surface, by extraction + same-line edit on every budget-owned file it touches:
# scripts/runtime/game_runtime.gd (session_runtime-owned) frees ~23 lines FIRST by
# extracting harvest_tile (+ its tile payload helper) into the NEW
