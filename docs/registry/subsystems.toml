# PRE-PHASE-7 SUITE EXPANSION co-modification: game_runtime.gd:207 seed_for_smoke now
# ALSO pins player_avatar._rng (wall-clock-seeded today at player_avatar.gd:42,47; the
# trigger draw is :205), so the determinism seam covers the FULL rng surface (encounter +
# battle + avatar) — real play still never calls it; boot / overworld_step / menu_save
# gain seed_for_smoke calls in smoke_scenarios.gd. save_stability (app_bootstrap registry
# entry) is the v4 save-surface byte-stability witness for this subsystem's save schema.
# PHASE 7 BUILD 1 CO-MODIFICATION (the `landmarks` subsystem entry owns the detail note):
# session_state.gd's world-key marshalling was EXTRACTED into the NEW
# scripts/runtime/session_payload.gd (to_payload/apply_into), making room for the additive
# landmark_state var + the FROZEN location-keyed state seam landmark_state_for(chain:
# Vector2i) -> Dictionary / set_landmark_state(chain, state) — Build 1 resolves BOTH to
# the top-level v4-additive key (absent -> {}; NO SAVE_VERSION bump, chained worlds
# unreachable); Build 3 extends the resolution to chained_worlds[world_id_for(chain)].
# landmark_state WITHOUT rewriting landmark_runtime (written against the seam, never the
# keying). game_runtime.gd wires LandmarkRuntime ONLY (instantiation + step + the
# footprint encounter-scope read feeding generate_wild_encounter), at its 320 budget via
# extraction.
# PHASE 7 BUILD 3 CO-MODIFICATION (the `landmarks` subsystem entry owns the world-depth
# detail): session_state.gd bumps SAVE_VERSION 4->5 + gains the root_seed/active_chain/
# chained_worlds vars (get/set_chained_worlds accessors), and reset_for_new_game draws
# root_seed = the new-game world_seed (the frozen origin identity world_seed_for(root,
# (0,0)) == root). session_payload.gd emits the v5 keys in to_payload (the active world
# keeps its 15 v4 keys EXACTLY; its landmark_state nests under chained_worlds[active_chain]
# .landmark_state — the v4 top-level seat is retired) and PREPENDS SaveMigration.migrate
# in apply_into (new save_version argument — save_migration.gd must NOT preload
# SessionState, the preload cycle session_state->session_payload->save_migration->
# session_state). The pure v4->v5 transform lives in the NEW scripts/domain/
# save_migration.gd — OWNED BY the `landmarks` entry's code_paths (one world-depth home,
# the world_overrides.gd sibling pattern; NOT double-listed here), the delegation chain
# session_state -> session_payload -> save_migration. The frozen v4 golden fixture stays
# the migration WITNESS (save_stability's one pinned guard line canonicalizes
# migrate(golden); update mode downshifts; a v5-shaped write is refused — app_bootstrap).

