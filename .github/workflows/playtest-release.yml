name: playtest-release

# Shared Linux/Windows/macOS playtest releases. One artifact per OS, no
# per-friend package. A stable cohort invite (PLAYTEST_COHORT_INVITE_TOKEN)
# is embedded so a tester who never received a friend package can still F-report
# without a GitHub account. Persisted user:// friend identity still wins.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows:
      - playtests-headless
      - feedback-relay-deploy
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

concurrency:
  group: playtest-release-playtest
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.6.1-stable
  CHANNEL: playtest

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: playtest-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: Refuse a stale playtest publish
        run: |
          git fetch --no-tags origin main
          current="$(git rev-parse origin/main)"
          wanted="$(git rev-parse HEAD)"
          if [ "$current" != "$wanted" ]; then
            echo "refusing stale playtest publish ${wanted}; origin/main is ${current}" >&2
            exit 1
          fi
      - name: Require a green playtests-headless run for this SHA
        if: github.event_name != 'workflow_run' || github.event.workflow_run.name != 'playtests-headless'
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_WORKFLOW: ${{ github.event.workflow_run.name }}
        run: |
          sha="$(git rev-parse HEAD)"
          count="$(gh run list --workflow playtests-headless --commit "$sha" --status success --json databaseId --jq 'length')"
          if [ "${count:-0}" -ge 1 ]; then
            echo "skip_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$TRIGGER_WORKFLOW" = "feedback-relay-deploy" ]; then
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
            echo "skipping playtest publish ${sha}; no successful playtests-headless run"
            exit 0
          fi
          echo "refusing unvalidated playtest publish ${sha}; no successful playtests-headless run" >&2
          exit 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Skip a SHA that is already latest
        if: github.event_name != 'workflow_dispatch'
        id: latest
        env:
          PLAYTEST_FEEDBACK_ENDPOINT: ${{ secrets.PLAYTEST_FEEDBACK_ENDPOINT }}
        run: |
          if [ "${{ steps.gate.outputs.skip_publish }}" = "true" ]; then
            echo "already_published=true"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -o pipefail
          line="$(python3 tools/publish_update.py --channel "${CHANNEL}" --already-published | tail -n 1)"
          echo "$line"
          echo "$line" >> "$GITHUB_OUTPUT"
      - name: Require the production relay for this SHA
        if: steps.latest.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYTEST_FEEDBACK_ENDPOINT: ${{ secrets.PLAYTEST_FEEDBACK_ENDPOINT }}
        run: |
          git fetch --no-tags origin main
          required="$(python3 -c 'import sys; sys.path.insert(0, "tools"); import publish_update; print(publish_update.required_relay_commit())')"
          head="$(git rev-parse HEAD)"
          run_count() {
            gh run list --workflow feedback-relay-deploy --commit "$1" --status "$2" --json databaseId --jq 'length'
          }
          pending_count() {
            local sha="$1" total=0 status
            for status in in_progress queued waiting pending requested; do
              total=$((total + $(run_count "$sha" "$status")))
            done
            echo "$total"
          }
          attempts=24
          for attempt in $(seq 1 "$attempts"); do
            set -o pipefail
            if line="$(python3 tools/publish_update.py --channel "${CHANNEL}" --require-production-relay | tail -n 1)" \
                && [ "${line#production_relay=}" != "$line" ]; then
              tag="${line#production_relay=}"
              if [ "$(run_count "$tag" success)" -ge 1 ]; then
                exit 0
              fi
            fi
            pending=$(( $(pending_count "$required") + $(pending_count "$head") ))
            failed=$(( $(run_count "$required" failure) + $(run_count "$head" failure) ))
            if [ "$pending" -lt 1 ] && [ "$failed" -ge 1 ]; then
              echo "refusing stale production relay ${required}; feedback-relay-deploy failed" >&2
              exit 1
            fi
            if [ "$attempt" -lt "$attempts" ]; then
              echo "waiting for production relay ${required} (attempt ${attempt}/${attempts})"
              sleep 30
            fi
          done
          echo "refusing stale production relay ${required}; no successful feedback-relay-deploy" >&2
          exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.latest.outputs.already_published != 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/feedback-relay/package-lock.json
      - name: Install Wrangler from the lockfile
        if: steps.latest.outputs.already_published != 'true'
        working-directory: services/feedback-relay
        run: npm ci
      - name: Restore the pinned Godot binary
        if: steps.latest.outputs.already_published != 'true'
        id: godot-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64
      - name: Download the pinned Godot binary on cache miss
        if: steps.latest.outputs.already_published != 'true' && steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/godot-bin"
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d "$HOME/godot-bin"
          mv "$HOME/godot-bin/Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/godot-bin/godot"
          chmod +x "$HOME/godot-bin/godot"
      - name: Restore the pinned export templates
        if: steps.latest.outputs.already_published != 'true'
        id: templates-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/godot/export_templates/4.6.1.stable
          key: godot-export-templates-${{ env.GODOT_VERSION }}
      - name: Download export templates on cache miss
        if: steps.latest.outputs.already_published != 'true' && steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates"
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/4.6.1.stable"
      - name: Assert the Godot version triple (the R3 pin rule)
        if: steps.latest.outputs.already_published != 'true'
        run: |
          version="$("$HOME/godot-bin/godot" --version)"
          echo "godot --version: $version"
          case "$version" in
            4.6.1.*) ;;
            *) echo "expected a 4.6.1.* Godot triple, got: $version"; exit 1 ;;
          esac
      - name: Restore the imported-resource cache
        if: steps.latest.outputs.already_published != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('assets/**', 'project.godot') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-
      - name: Import project resources (a fresh checkout has no .godot/)
        if: steps.latest.outputs.already_published != 'true'
        run: timeout 3000 "$HOME/godot-bin/godot" --headless --path . --import
      - name: Require the accountless cohort invite
        if: steps.latest.outputs.already_published != 'true'
        env:
          PLAYTEST_COHORT_INVITE_TOKEN: ${{ secrets.PLAYTEST_COHORT_INVITE_TOKEN }}
        run: |
          if [ -z "${PLAYTEST_COHORT_INVITE_TOKEN}" ]; then
            echo "PLAYTEST_COHORT_INVITE_TOKEN is required so shared builds can F-report" >&2
            exit 1
          fi
      - name: Publish shared Linux, Windows, and macOS updates
        if: steps.latest.outputs.already_published != 'true'
        env:
          PLAYTEST_FEEDBACK_ENDPOINT: ${{ secrets.PLAYTEST_FEEDBACK_ENDPOINT }}
          PLAYTEST_FEEDBACK_ADMIN_TOKEN: ${{ secrets.PLAYTEST_FEEDBACK_ADMIN_TOKEN }}
          PLAYTEST_COHORT_INVITE_TOKEN: ${{ secrets.PLAYTEST_COHORT_INVITE_TOKEN }}
          PLAYTEST_COHORT_NICKNAME: ${{ vars.PLAYTEST_COHORT_NICKNAME || 'shared-playtest' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          export GODOT_BIN="$HOME/godot-bin/godot"
          export PATH="${GITHUB_WORKSPACE}/services/feedback-relay/node_modules/.bin:${PATH}"
          python3 tools/publish_update.py --channel "${CHANNEL}" --require-cohort
      - name: Summarize the public receipt
        if: steps.latest.outputs.already_published != 'true'
        run: |
          receipt="$(find dist/updates -name receipt.json -type f | head -n 1)"
          if [ -z "$receipt" ]; then
            echo "missing public receipt" >&2
            exit 1
          fi
          python3 - "$receipt" >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json
          import sys
          doc = json.loads(open(sys.argv[1], encoding="utf-8").read())
          dumped = json.dumps(doc)
          if "invite" in dumped or "token" in dumped:
              raise SystemExit("receipt must not mention invite tokens")
          missing = {"linux", "windows", "macos"} - set(doc.get("artifacts", {}))
          if missing:
              raise SystemExit(f"receipt is missing OS artifacts: {sorted(missing)}")
          print(f"### shared {doc['channel']} update `{doc['build_id']}`\n")
          for os_name, artifact in doc["artifacts"].items():
              print(f"- {os_name}: `{artifact['filename']}` ({artifact['bytes']} bytes)")
          EOF
          echo "RECEIPT_PATH=$receipt" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.latest.outputs.already_published != 'true'
        with:
          name: playtest-release-${{ env.CHANNEL }}
          path: dist/updates/*/
          if-no-files-found: error
          retention-days: 14
      - name: Attach tagged binaries to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          PLAYTEST_FEEDBACK_ENDPOINT: ${{ secrets.PLAYTEST_FEEDBACK_ENDPOINT }}
        run: |
          stage="$(mktemp -d)"
          export PYTHONPATH="${GITHUB_WORKSPACE}/tools"
          export RELEASE_STAGE="$stage"
          mapfile -t files < <(python3 - <<'EOF'
          from pathlib import Path
          import os
          import publish_update
          dest = Path(os.environ["RELEASE_STAGE"])
          receipt = os.environ.get("RECEIPT_PATH", "")
          if receipt:
              staged = publish_update.stage_github_release_assets(Path(receipt), dest)
          else:
              latest = publish_update.fetch_latest(
                  os.environ["PLAYTEST_FEEDBACK_ENDPOINT"], os.environ["CHANNEL"])
              staged = publish_update.stage_github_release_from_latest(latest, dest)
          for path in staged:
              print(path)
          EOF
          )
          if [ "${#files[@]}" -ne 3 ]; then
            echo "expected 3 stable GitHub Release assets, got ${#files[@]}" >&2
            exit 1
          fi
          for expected in PokeWilds-linux.x86_64 PokeWilds-windows.exe PokeWilds-macos.zip; do
            printf '%s\n' "${files[@]}" | grep -q "/${expected}$" || {
              echo "missing stable GitHub Release asset ${expected}" >&2
              exit 1
            }
          done
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
              --title "PokeWilds ${GITHUB_REF_NAME}" \
              --notes "Shared Linux, Windows, and macOS playtest builds. F reporting stays accountless; existing friend identity is preserved across UPDATE."
          fi
