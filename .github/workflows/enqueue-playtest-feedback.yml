name: enqueue-playtest-feedback

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: enqueue-playtest-feedback-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  enqueue:
    if: ${{ github.event.issue.pull_request == null && github.event.label.name == 'playtest-feedback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start Cursor automation
        env:
          WEBHOOK_URL: https://api2.cursor.sh/automations/webhook/1b041852-a0a4-11f1-b532-320a589b8025
          WEBHOOK_KEY: ${{ secrets.CURSOR_AUTOMATION_API_KEY }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          if [ -z "$WEBHOOK_KEY" ]; then
            echo "missing CURSOR_AUTOMATION_API_KEY" >&2
            exit 1
          fi
          python3 -c '
          import json, os, sys, urllib.error, urllib.request
          issue_url = os.environ["ISSUE_URL"]
          issue_number = os.environ["ISSUE_NUMBER"]
          issue_title = os.environ["ISSUE_TITLE"]
          context = "Playtest feedback issue %s: %s\nissue_url=%s" % (
              issue_number, issue_title, issue_url
          )
          payload = {
              "context": context,
              "issue_url": issue_url,
              "issue_number": int(issue_number),
              "issue_title": issue_title,
              "repo": "ThomsenDrake/poke-wilds-gd",
              "prompt": {"text": context},
          }
          request = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + os.environ["WEBHOOK_KEY"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("enqueued issue %s status=%s" % (issue_number, response.status))
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", "replace")[:2000]
              print("webhook failed: HTTP %s %s" % (exc.code, body), file=sys.stderr)
              raise SystemExit(1)
          '
